<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Medidas</title>

    <!-- Vincula o arquivo CSS externo -->
    <link rel="stylesheet" href="css/conversor.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">

</head>
<body>
<div class="container">
    <h2>Conversor de Medidas</h2>

    <!-- Controles invisíveis de estado das abas (Agora são 3) -->
       <input type="radio" id="aba1" name="abas-controle" class="radio-aba" checked>
    <input type="radio" id="aba2" name="abas-controle" class="radio-aba">
    <input type="radio" id="aba3" name="abas-controle" class="radio-aba">

<!-- Botões das abas -->

<div class="abas-botoes">
        <label for="aba1" class="btn-aba">CM → MM / POL</label>
        <label for="aba2" class="btn-aba">POL → MM / CM</label>
        <label for="aba3" class="btn-aba">CM ↔ METRO</label>
    </div>
<!-- Tela 1: CENTÍMETROS para MM e Polegadas -->

    <form id="conteudo-cm-outros" class="secao-conversor" oninput="resultadoMm1.value = (Number(cmInput.value) * 10).toFixed(1); resultadoPol1.value = (Number(cmInput.value) / 2.54).toFixed(3)">
        <div class="grupo-input">
            <label for="cmInput" class="legenda-input">CM:</label>
            <input type="number" id="cmInput" placeholder="Digite em centímetros..." step="any" min="0">
        </div>
        <div class="resultado dupla">
            <div>
                <span>Milímetros:</span>
                <output name="resultadoMm1">0</output>
                <span>mm</span>
            </div>
            <div>
                <span>Polegadas:</span>
                <output name="resultadoPol1">0</output>
                <span>pol (in)</span>
            </div>
        </div>
    </form>

    <!-- Tela 2: Polegadas para MM e CM -->

    <form id="conteudo-pol-metric" class="secao-conversor" oninput="resultadoMm2.value = (Number(polInput.value) * 25.4).toFixed(2); resultadoCm2.value = (Number(polInput.value) * 2.54).toFixed(3)">
        <div class="grupo-input">
            <label for="polInput" class="legenda-input">POL:</label>
            <input type="number" id="polInput" placeholder="Digite em polegadas..." step="any" min="0">
        </div>
        <div class="resultado dupla">
            <div>
                <span>Milímetros:</span>
                <output name="resultadoMm2">0</output>
                <span>mm</span>
            </div>
            <div>
                <span>Centímetros:</span>
                <output name="resultadoCm2">0</output>
                <span>cm</span>
            </div>
        </div>
    </form>

    <!-- NOVA Tela 3: Centímetro para Metro e Vice-Versa (Conversão mútua simultânea) -->


    <form id="conteudo-cm-metro" class="secao-conversor" oninput="resultadoMetro.value = (Number(cmMetroInput.value) / 100).toFixed(2); resultadoCmOut.value = (Number(metroInput.value) * 100).toFixed(2)">
        <div class="titulo-bloco">Centímetros para Metros</div>
        <div class="grupo-input">
            <label for="cmMetroInput" class="legenda-input">CM:</label>
            <input type="number" id="cmMetroInput" placeholder="Digite em cm..." step="any" min="0">
        </div>
        <div class="resultado">
            <span>Metros:</span>
            <output name="resultadoMetro">0</output>
            <span>m</span>
        </div>

        <div class="titulo-bloco" style="margin-top: 20px;">Metros para Centímetros</div>
        <div class="grupo-input">
            <label for="metroInput" class="legenda-input">M:</label>
            <input type="number" id="metroInput" placeholder="Digite em metros..." step="any" min="0">
        </div>
        <div class="resultado">
            <span>Centímetros:</span>
            <output name="resultadoCmOut">0</output>
            <span>cm</span>
        </div>
    </form>
    
</body>
</html>
